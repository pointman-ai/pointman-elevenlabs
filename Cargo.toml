[package]
name = "elevenlabs"
version = "0.2.0"
edition = "2021"
description = "ElevenLabs on Pointman's machines: a thin wrapper of ElevenLabs' official CLI."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-elevenlabs"
publish = false

[dependencies]
anyhow = "1"
flate2 = "1"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "d338e27a5719139d7cafae4f838c1b699395710b" }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
toml = "0.8"

[profile.release]
strip = true
lto = true
