name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # ElevenLabs' real CLI, checked against its sha256, for tests/real_cli.rs: a .env above a job can't send
      # the key elsewhere. With ELEVENLABS_REAL_CLI set, that test fails rather than skips when it's missing.
      - name: ElevenLabs' CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) t=x86_64-unknown-linux-musl ;;
            Linux-ARM64) t=aarch64-unknown-linux-musl ;;
            macOS-ARM64) t=aarch64-apple-darwin ;;
            macOS-X64) t=x86_64-apple-darwin ;;
          esac
          mkdir -p "$RUNNER_TEMP/elevenlabs" && cd "$RUNNER_TEMP/elevenlabs"
          gh release download --repo elevenlabs/cli --pattern "elevenlabs-cli-$t.tar.gz" --pattern "elevenlabs-cli-$t.tar.gz.sha256"
          shasum -a 256 -c "elevenlabs-cli-$t.tar.gz.sha256"
          tar -xzf "elevenlabs-cli-$t.tar.gz"
          echo "ELEVENLABS_REAL_CLI=$RUNNER_TEMP/elevenlabs/elevenlabs-cli-$t/elevenlabs" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
